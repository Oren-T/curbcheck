name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `make setup` installs with --require-hashes, so a tampered or
      # unexpected artifact fails the build rather than the test suite
      # (SPEC §3.1, threat T1). Nothing is installed for the frontend here:
      # MapLibre and PMTiles are checked in under web/vendor/ and the lint job
      # below fetches its two tools on its own.
      - run: make setup
      - run: make check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # STYLE_GUIDE §4 says the frontend passes Prettier and ESLint under the
      # same CI gate as Python, and until this job existed that was not true.
      # The repo has no package.json on purpose (no bundler, vendored libs), so
      # the versions are pinned in the command rather than in a lockfile; both
      # were run against this tree before being written down.
      - run: npx --yes prettier@3.9.6 --check web site
      - run: npx --yes eslint@10.10.0 web site

      # The browser engine's unit tests (docs/STATIC_SITE.md). The differential
      # harness needs the database and runs in pages.yml, where one is built.
      - run: node --test site/tests/*.test.js site/tests/harness/*.test.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only: the image is never pushed anywhere, and there is nothing to
      # smoke-test without a 71 MB database. What this catches is a Dockerfile
      # that no longer matches the tree — a renamed package directory, a
      # requirements.txt whose hashes stopped verifying, a missing CLAUDE.md
      # that hatchling reads as the long description.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: curbcheck:ci

      # The entrypoint is `curbcheck`; if the console script or the frontend
      # copy is wrong, this fails without needing any data.
      - run: docker run --rm curbcheck:ci --help
      - run: >
          docker run --rm --entrypoint python curbcheck:ci -c
          "from curbcheck.cli import WEB_DIR; assert (WEB_DIR / 'index.html').is_file(), WEB_DIR"
