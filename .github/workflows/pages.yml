# The static site (docs/STATIC_SITE.md): run the ETL, compile the pack, prove
# the browser engine agrees with the Python one on that exact data, build
# dist/, deploy to GitHub Pages.
#
# Weekly because DOT posts sign changes and calendar corrections through the
# week. GitHub disables `schedule` after 60 days without a commit; the site's
# own staleness notice (14 days) is what tells a visitor when that happened.

name: pages

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "site/**"
      - "curbcheck/**"
      - "scripts/fetch_basemap_tiles.py"
      - "requirements*.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a run mid-deploy: a half-updated site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # go-pmtiles cuts the Manhattan basemap out of the Protomaps daily build
  # (scripts/fetch_basemap_tiles.py). Pinned by URL and SHA-256 because the
  # release ships no checksums file; the digest is the one the GitHub Releases
  # API reports for the asset and was verified against a local download.
  PMTILES_URL: https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Hash-pinned, the same install a developer runs (threat T1).
      - run: make setup

      - id: pages
        uses: actions/configure-pages@v5

      - id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT" && echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # The raw downloads, refreshed at most weekly. `restore-keys` turns a
      # miss into a slower run rather than an empty directory.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ steps.week.outputs.iso }}
          restore-keys: raw-

      # The manifest on its own, carried forward across every run: the ETL's
      # row-count drift check only compares against the previous entry for the
      # same URL, and without this every run would be a first run with nothing
      # to compare to.
      - uses: actions/cache@v4
        with:
          path: data/raw/manifest.jsonl
          key: manifest-${{ github.run_id }}
          restore-keys: manifest-

      # The six allowlisted hosts, HTTPS only, through curbcheck/net.py. A
      # drift abort fails the job and the previous deploy stays live.
      - run: curbcheck sync

      - id: basemap
        uses: actions/cache@v4
        with:
          path: data/basemap
          key: basemap-${{ steps.week.outputs.month }}

      - if: steps.basemap.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/go-pmtiles.tar.gz "$PMTILES_URL"
          echo "$PMTILES_SHA256  /tmp/go-pmtiles.tar.gz" | sha256sum --check
          mkdir -p /tmp/pmtiles && tar -xzf /tmp/go-pmtiles.tar.gz -C /tmp/pmtiles pmtiles
          PATH="/tmp/pmtiles:$PATH" python scripts/fetch_basemap_tiles.py

      - run: curbcheck pack --out build/pack

      # The deploy gate: the Python engine's answers, replayed through the
      # browser engine over the pack that is about to ship.
      - run: python site/tests/harness/make_fixtures.py
      - run: node --test site/tests/*.test.js site/tests/harness/*.test.js

      - run: python site/slice_basemap.py data/basemap/manhattan.pmtiles build/tiles
      - run: python site/build.py --out build/dist --pack build/pack --tiles build/tiles --base-path "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
