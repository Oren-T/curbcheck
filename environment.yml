# Conda environment for the dev container. Read at image build time, so a
# Rebuild Container reproduces exactly this environment.
#
# It carries only the interpreter, pip, and the Jupyter kernel the container
# requires. Application packages are hash-pinned in requirements*.txt and
# installed with pip; see docs/DECISIONS.md D7.

name: curbcheck

channels:
  - conda-forge

dependencies:
  # Required: the container registers a Jupyter kernel and the build fails
  # without it.
  - ipykernel=7.3.0

  # Pin the interpreter so rebuilds don't drift onto a new minor version.
  - python=3.12.13

  - pip
